name: lint-free
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subdir: [web-app, machine-learning-client]
    defaults:
      run:
        working-directory: ${{ matrix.subdir }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Report empty subsystem
        if: ${{ hashFiles(format('{0}/**/*.py', matrix.subdir)) == '' }}
        run: echo "No Python files yet; lint checks will run when code is added."
      - name: Install subsystem dependencies
        if: ${{ hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::This subsystem has Python code but no requirements.txt."
            exit 1
          fi
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Lint with pylint
        if: ${{ hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        run: git ls-files -z -- '*.py' | xargs -0 python -m pylint
      - name: Format with black
        if: ${{ hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        run: python -m black --diff --check .

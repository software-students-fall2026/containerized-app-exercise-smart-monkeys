name: Compose startup check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: monkeymoves-ci-${{ github.run_id }}
      WEB_PORT: "18080"
      MONGO_DB: monkeymoves_compose_ci
    steps:
      - uses: actions/checkout@v6
      - name: Validate and start services
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:18080/health
      - name: Verify HTTP upload reaches MongoDB
        run: |
          docker compose cp integration/web_smoke_test.py web-app:/tmp/web_smoke_test.py
          docker compose exec -T web-app python /tmp/web_smoke_test.py
      - name: Show failure logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean up test resources
        if: always()
        run: docker compose down --volumes --remove-orphans

name: Compose startup and persistence checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: monkeymoves-ci-${{ github.run_id }}
      WEB_PORT: "18080"
      MONGO_DB: monkeymoves_compose_ci
    steps:
      - uses: actions/checkout@v6
      - name: Validate and start services
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:18080/health
      - name: Check persistence script and save a test record
        run: |
          docker compose cp integration/check_persistence.py web-app:/tmp/check_persistence.py
          docker compose exec -T web-app python -m black --check /tmp/check_persistence.py
          docker compose exec -T web-app python -m pylint --persistent=n /tmp/check_persistence.py
          docker compose exec -T web-app python /tmp/check_persistence.py write "$GITHUB_RUN_ID"
      - name: Recreate containers and verify saved data
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:18080/health
          docker compose cp integration/check_persistence.py web-app:/tmp/check_persistence.py
          docker compose exec -T web-app python /tmp/check_persistence.py verify "$GITHUB_RUN_ID"
      - name: Show failure logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean up test resources
        if: always()
        run: docker compose down --volumes --remove-orphans

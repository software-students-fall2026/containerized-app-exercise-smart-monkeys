name: Three-container integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: monkeymoves-ci-${{ github.run_id }}
      WEB_PORT: "18080"
      MONGO_DB: monkeymoves_compose_ci
    steps:
      - uses: actions/checkout@v6
      - name: Download verified gesture sample
        run: |
          curl -fL --max-time 30 -o /tmp/victory.jpg https://storage.googleapis.com/mediapipe-tasks/gesture_recognizer/victory.jpg
          echo "6ac265f3ace6a6c4ac4a9079b63fcce4ab6517272afb1e430857f55ef324fde6  /tmp/victory.jpg" | sha256sum --check
      - name: Validate and start services
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:18080/health
      - name: Check persistence script and save a test record
        run: |
          docker compose cp integration/. web-app:/tmp/checks
          docker compose exec -T web-app python -m black --check /tmp/checks
          docker compose exec -T web-app python -m pylint --persistent=n --recursive=y /tmp/checks
          docker compose exec -T web-app python /tmp/checks/check_persistence.py write "$GITHUB_RUN_ID"
          docker compose cp /tmp/victory.jpg web-app:/tmp/victory.jpg
          docker compose exec -T web-app python /tmp/checks/web_smoke_test.py --gesture /tmp/victory.jpg
      - name: Recreate containers and verify saved data
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:18080/health
          docker compose cp integration/. web-app:/tmp/checks
          docker compose exec -T web-app python /tmp/checks/check_persistence.py verify "$GITHUB_RUN_ID"
          docker compose cp /tmp/victory.jpg web-app:/tmp/victory.jpg
          docker compose exec -T web-app python /tmp/checks/web_smoke_test.py --gesture /tmp/victory.jpg
      - name: Show failure logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean up test resources
        if: always()
        run: docker compose down --volumes --remove-orphans

services:
  web-app:
    build:
      context: ./web-app
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    environment:
      MONGO_URI: mongodb://db:27017/${MONGO_DB:-monkeymoves}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

  db:
    image: mongo:8.0.16
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped

volumes:
  mongo-data:
